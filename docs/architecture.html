<title>Spotter Architecture</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one white technical diagram (draw.io style) in an SVG, five columns left→right:
   data → match engine → proposer agents → board + card workflow → model gateway, browser underneath.
   Deliberately a single light look so it screenshots cleanly into the README. */
:root {
  color-scheme: light;
  --bg: #ffffff; --ink: #1f2933; --muted: #5b6774; --line: #33404d; --group: #f5f7f9; --group-line: #c9d2db;
  --mini: #047857; --mini-bg: #ecfdf5; --nano: #b45309; --nano-bg: #fffbeb; --speech: #1d4ed8; --speech-bg: #eff6ff;
  --store: #6d28d9; --store-bg: #f5f3ff; --reject: #dc2626;
  --sans: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
}
body { background: var(--bg); color: var(--ink); font-family: var(--sans); }
.wrap {
  padding-block: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.scroll { overflow-x: auto; }
svg { display: block; width: 100%; min-width: 1100px; max-width: 1600px; margin: 0 auto; height: auto; }
svg text { font-family: var(--sans); fill: var(--ink); }
.t { font-size: 15px; font-weight: 600; }
.s { font-size: 12px; fill: var(--muted); }
.m { font-family: var(--mono); font-size: 11.5px; fill: var(--ink); }
.g { font-size: 12px; font-weight: 700; letter-spacing: .08em; fill: var(--muted); }
.h1 { font-size: 24px; font-weight: 700; }
.lbl { font-size: 11px; fill: var(--muted); }
.box { fill: #fff; stroke: var(--line); stroke-width: 1.3; }
.grp { fill: var(--group); stroke: var(--group-line); stroke-width: 1.2; stroke-dasharray: 5 4; }
.file { fill: var(--store-bg); stroke: var(--store); stroke-width: 1.1; }
.mini { fill: var(--mini-bg); stroke: var(--mini); stroke-width: 1.4; }
.nano { fill: var(--nano-bg); stroke: var(--nano); stroke-width: 1.4; }
.speech { fill: var(--speech-bg); stroke: var(--speech); stroke-width: 1.4; }
.a { stroke: var(--line); stroke-width: 1.4; fill: none; marker-end: url(#arr); }
.ad { stroke: var(--line); stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; marker-end: url(#arr); }
.ar { stroke: var(--reject); stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrR); }
.ap { stroke: var(--store); stroke-width: 1.3; fill: none; stroke-dasharray: 4 3; marker-end: url(#arrP); }
</style>

<div class="wrap"><div class="scroll">
<svg viewBox="0 0 1600 1010" role="img" aria-label="Spotter system architecture diagram">

    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
  </defs>
  <rect width="1600" height="1010" fill="#ffffff"/>

  <text x="30" y="38" class="h1">Spotter — system architecture</text>
  <text x="30" y="60" class="s">One FastAPI process, in-memory state, one WebSocket. Blackboard pattern: agents never call each other.</text>

  <g transform="translate(1010 26)">
    <rect x="0" y="0" width="22" height="14" rx="3" class="mini"/><text x="28" y="12" class="lbl">gpt-5-mini call</text>
    <rect x="120" y="0" width="22" height="14" rx="3" class="nano"/><text x="148" y="12" class="lbl">gpt-5-nano call</text>
    <rect x="245" y="0" width="22" height="14" rx="3" class="speech"/><text x="273" y="12" class="lbl">Azure AI Speech</text>
    <rect x="375" y="0" width="22" height="14" rx="3" class="file"/><text x="403" y="12" class="lbl">file on disk</text>

  <!-- ===== Column 1: data ===== -->

  <text x="44" y="108" class="g">DATA · backend/app/data</text>
  <text x="44" y="124" class="lbl">generated by generator/ (seed 42), validated</text>
  <rect x="44" y="136" width="252" height="36" rx="4" class="file"/><text x="56" y="159" class="m">match_events.json  1,749 events</text>
  <rect x="44" y="180" width="252" height="36" rx="4" class="file"/><text x="56" y="203" class="m">squads.json · teams.json</text>
  <rect x="44" y="224" width="252" height="36" rx="4" class="file"/><text x="56" y="247" class="m">league_history.json  10 matchdays</text>
  <rect x="44" y="268" width="252" height="36" rx="4" class="file"/><text x="56" y="291" class="m">dossiers.json  derived season stats</text>
  <rect x="44" y="312" width="252" height="36" rx="4" class="file"/><text x="56" y="335" class="m">templates_{en,es,fr,de}.json</text>
  <text x="44" y="372" class="s">Loaded into memory at startup.</text>
  <text x="44" y="390" class="s">No database, no vector store.</text>

  <rect x="30" y="440" width="280" height="190" rx="8" class="grp"/>
  <text x="44" y="463" class="g">DISK · written at runtime</text>
  <rect x="44" y="476" width="252" height="36" rx="4" class="file"/><text x="56" y="499" class="m">cache/llm/*.json  record/replay</text>
  <rect x="44" y="520" width="252" height="36" rx="4" class="file"/><text x="56" y="543" class="m">cache/audio/*.mp3  by text hash</text>
  <rect x="44" y="564" width="252" height="36" rx="4" class="file"/><text x="56" y="587" class="m">cost_ledger.json  running $</text>
  <text x="44" y="618" class="s">Written only by llm.py (gateway)</text>

  <!-- ===== Column 2: match engine ===== -->
  <rect x="350" y="85" width="290" height="545" rx="8" class="grp"/>
  <text x="364" y="108" class="g">MATCH ENGINE · code</text>
  <rect x="366" y="122" width="258" height="62" rx="6" class="box"/>
  <text x="380" y="147" class="t">MatchClock</text><text x="380" y="168" class="s">1× 2× 5×, seek · runs 2 s ahead of screen</text>
  <rect x="366" y="214" width="258" height="62" rx="6" class="box"/>
  <text x="380" y="239" class="t">StatsEngine</text><text x="380" y="260" class="s">pass difficulty, xG, control, chaos, alerts</text>
  <rect x="366" y="306" width="258" height="62" rx="6" class="box"/>
  <text x="380" y="331" class="t">MatchState</text><text x="380" y="352" class="s">score, players, settings, directives</text>
  <rect x="366" y="398" width="258" height="62" rx="6" class="box"/>
  <text x="380" y="423" class="t">Dispatcher</text><text x="380" y="444" class="s">event → wake agents · cooldowns, cap</text>
  <rect x="366" y="530" width="258" height="70" rx="6" class="nano"/>
  <text x="380" y="555" class="t">Caller · play-by-play</text><text x="380" y="576" class="s">gpt-5-nano, 1.4 s deadline → template</text>
  <text x="380" y="592" class="s">continuous, one shared speech channel</text>

  <path d="M495 184 V210" class="a"/>
  <path d="M495 276 V302" class="a"/>
  <path d="M495 368 V394" class="a"/>
  <path d="M310 154 H362" class="a"/><text x="318" y="146" class="lbl">events</text>
  <path d="M370 154 H352 V565 H362" class="ad"/><text x="356" y="500" class="lbl" transform="rotate(-90 356 500)">event stream</text>

  <!-- ===== Column 3: proposer agents ===== -->
  <rect x="690" y="85" width="310" height="300" rx="8" class="grp"/>
  <text x="704" y="108" class="g">PROPOSER AGENTS</text>
  <text x="704" y="124" class="lbl">Microsoft Agent Framework · gpt-5-mini · run concurrently</text>
  <rect x="704" y="138" width="138" height="56" rx="6" class="mini"/><text x="716" y="162" class="t">Stats Scout</text><text x="716" y="182" class="s">numbers, milestones</text>
  <rect x="850" y="138" width="138" height="56" rx="6" class="mini"/><text x="862" y="162" class="t">Tactical Analyst</text><text x="862" y="182" class="s">control, shape, why</text>
  <rect x="704" y="202" width="138" height="56" rx="6" class="mini"/><text x="716" y="226" class="t">Dossier</text><text x="716" y="246" class="s">season, table, H2H</text>
  <rect x="850" y="202" width="138" height="56" rx="6" class="mini"/><text x="862" y="226" class="t">Storyline</text><text x="862" y="246" class="s">threads in this match</text>
  <text x="704" y="284" class="s">Each run: prompt + match context → tool calls</text>
  <text x="704" y="302" class="s">→ one JSON card: text, numeric claims,</text>
  <text x="704" y="320" class="s">evidence event ids — or null.</text>
  <text x="704" y="350" class="m">one wake = one agent.run()</text>

  <path d="M624 429 H660 V170 H700" class="a"/><text x="628" y="420" class="lbl">wake</text>

  <rect x="690" y="410" width="310" height="110" rx="8" class="box"/>
  <text x="704" y="434" class="t">match_tools.py · function tools</text>
  <text x="704" y="454" class="m">get_player_stats  get_control_chaos</text>
  <text x="704" y="472" class="m">get_player_dossier  get_head_to_head</text>
  <text x="704" y="490" class="m">get_league_table  get_recent_cards …</text>
  <text x="704" y="510" class="s">read-only, JSON results</text>
  <path d="M845 385 V406" class="a"/><path d="M835 406 V389" class="a"/>
  <text x="852" y="400" class="lbl">tool calls</text>
  <path d="M690 450 H650 V245 H628" class="a"/><text x="634" y="300" class="lbl" transform="rotate(-90 640 300)">stats</text>
  <path d="M690 512 H672 V738 H330 V380 H314" class="ap"/><text x="380" y="732" class="lbl">tools read dossiers / history / squads (in memory)</text>

  <rect x="690" y="545" width="310" height="85" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="704" y="568" class="t">Retrieval: tool calls, not vector RAG</text>
  <text x="704" y="588" class="s">No embeddings. Agents look up exact values in</text>
  <text x="704" y="605" class="s">structured JSON and live stats through typed tools,</text>
  <text x="704" y="622" class="s">so the Verifier can recompute every number.</text>

  <!-- ===== Column 4: board + workflow ===== -->
  <rect x="1040" y="85" width="300" height="545" rx="8" class="grp"/>
  <text x="1054" y="108" class="g">BOOTH BOARD + CARD WORKFLOW</text>
  <text x="1054" y="124" class="lbl">Agent Framework workflow (WorkflowBuilder)</text>
  <rect x="1056" y="136" width="268" height="62" rx="6" class="box" stroke-width="2"/>
  <text x="1070" y="161" class="t">Booth Board (blackboard)</text><text x="1070" y="182" class="s">Proposed → Queue → Aired · in memory</text>
  <rect x="1056" y="230" width="268" height="62" rx="6" class="nano"/>
  <text x="1070" y="255" class="t">Verifier</text><text x="1070" y="276" class="s">code recomputes claims + nano wording check</text>

  <text x="1070" y="439" class="t">Narrator</text><text x="1070" y="460" class="s">one spoken line per language · numbers kept</text>

  <path d="M1056 270 H1020 V230 H992" class="ar"/>
  <text x="1006" y="292" class="lbl" fill="#dc2626" style="fill:#dc2626">rejected →</text>

  <text x="800" y="706" class="lbl">Caller lines → same speech channel</text>

  <rect x="1380" y="85" width="190" height="400" rx="8" fill="#fff" stroke="#33404d" stroke-width="2"/>
  <text x="1394" y="112" class="t">llm.py gateway</text>
  <text x="1394" y="132" class="s">every model + speech call</text>
  <text x="1394" y="164" class="m">• $8 hard cost cap</text>
  <text x="1394" y="186" class="m">• tokens → $ ledger</text>
  <text x="1394" y="208" class="m">• calls/min limit</text>
  <text x="1394" y="230" class="m">• record / replay</text>

  <text x="1394" y="310" class="s">Callers: proposers, Verifier,</text>
  <text x="1394" y="327" class="s">Producer, Narrator, Caller,</text>
  <text x="1394" y="344" class="s">directive parser, TTS.</text>

  <path d="M1324 353 H1376" class="a"/>

  <path d="M995 85 V74 H1360 V120 H1376" class="a"/><text x="1100" y="68" class="lbl">agent runs (with tool loop) → gateway</text>

  <text x="1394" y="543" class="g">MICROSOFT AZURE</text>
  <rect x="1394" y="556" width="162" height="70" rx="6" class="box"/>
  <text x="1406" y="580" class="t">Microsoft Foundry</text><text x="1406" y="598" class="s">gpt-5-mini</text><text x="1406" y="614" class="s">gpt-5-nano</text>
