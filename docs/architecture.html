<title>Spotter Architecture</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a lean white boxes-and-arrows diagram. Left: what the agents read. Middle: the four proposer
   agents. Right: the shared board and the chain that decides what is said. Bottom: live play-by-play and
   the human showrunner. Deliberately one light look so it screenshots cleanly into the README. */
:root {
  color-scheme: light;
  --bg: #ffffff; --ink: #1f2933; --muted: #5b6774; --line: #3a4652; --group: #f6f8fa; --group-line: #cdd5dd;
  --agent: #e8f5ef; --agent-line: #0f7a55; --check: #fff7e6; --check-line: #b4630a; --voice: #eaf1ff; --voice-line: #2457c5;
  --reject: #d23b3b;
  --sans: "IBM Plex Sans", system-ui, sans-serif;
}
body { background: var(--bg); color: var(--ink); font-family: var(--sans); }
.wrap {
  padding-block: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.scroll { overflow-x: auto; }
svg { display: block; width: 100%; min-width: 960px; max-width: 1400px; margin: 0 auto; height: auto; }
svg text { font-family: var(--sans); fill: var(--ink); }
.title { font-size: 26px; font-weight: 700; }
.sub { font-size: 14px; fill: var(--muted); }
.t { font-size: 17px; font-weight: 600; }
.s { font-size: 13px; fill: var(--muted); }
.g { font-size: 12.5px; font-weight: 700; letter-spacing: .1em; fill: var(--muted); }
.lbl { font-size: 12.5px; fill: var(--muted); }
.pill { font-size: 11.5px; font-weight: 600; }
.box { fill: #fff; stroke: var(--line); stroke-width: 1.4; }
.grp { fill: var(--group); stroke: var(--group-line); stroke-width: 1.2; stroke-dasharray: 5 4; }
.agent { fill: var(--agent); stroke: var(--agent-line); stroke-width: 1.5; }
.check { fill: var(--check); stroke: var(--check-line); stroke-width: 1.5; }
.voice { fill: var(--voice); stroke: var(--voice-line); stroke-width: 1.5; }
.board { fill: #fff; stroke: var(--ink); stroke-width: 2.2; }
.a { stroke: var(--line); stroke-width: 1.6; fill: none; marker-end: url(#arr); }
.ar { stroke: var(--reject); stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrR); }
</style>

<div class="wrap"><div class="scroll">
<svg viewBox="0 0 1400 800" role="img" aria-label="Spotter multi-agent architecture">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4652"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d23b3b"/></marker>
  </defs>
  <rect width="1400" height="800" fill="#ffffff"/>

  <text x="40" y="46" class="title">Spotter — multi-agent architecture</text>
  <text x="40" y="70" class="sub">Agents never call each other: they read the match through tools and post cards to a shared board (blackboard pattern).</text>

  <!-- ===== Left: what the agents read ===== -->
  <rect x="40" y="110" width="260" height="78" rx="8" class="box"/>
  <text x="58" y="142" class="t">Live match feed</text>
  <text x="58" y="166" class="s">synthetic events + player positions</text>

  <rect x="40" y="230" width="260" height="78" rx="8" class="box"/>
  <text x="58" y="262" class="t">Stats engine</text>
  <text x="58" y="286" class="s">xG, pass difficulty, control, chaos</text>

  <rect x="40" y="350" width="260" height="78" rx="8" class="box"/>
  <text x="58" y="382" class="t">Season data</text>
  <text x="58" y="406" class="s">player dossiers, table, head-to-head</text>

  <path d="M170 188 V226" class="a"/>

  <!-- dispatcher -->
  <rect x="360" y="110" width="200" height="78" rx="8" class="box"/>
  <text x="378" y="142" class="t">Dispatcher</text>
  <text x="378" y="166" class="s">wakes the right agents</text>
  <path d="M300 149 H356" class="a"/><text x="309" y="140" class="lbl">events</text>

  <!-- ===== Middle: proposer agents ===== -->
  <rect x="620" y="94" width="330" height="350" rx="10" class="grp"/>
  <text x="640" y="122" class="g">PROPOSER AGENTS</text>
  <text x="640" y="142" class="lbl">Microsoft Agent Framework · gpt-5-mini</text>
  <rect x="640" y="158" width="140" height="64" rx="8" class="agent"/><text x="656" y="186" class="t">Stats Scout</text><text x="656" y="208" class="s">key numbers</text>
  <rect x="790" y="158" width="140" height="64" rx="8" class="agent"/><text x="806" y="186" class="t">Tactical</text><text x="806" y="208" class="s">control &amp; shape</text>
  <rect x="640" y="232" width="140" height="64" rx="8" class="agent"/><text x="656" y="260" class="t">Dossier</text><text x="656" y="282" class="s">season context</text>
  <rect x="790" y="232" width="140" height="64" rx="8" class="agent"/><text x="806" y="260" class="t">Storyline</text><text x="806" y="282" class="s">match threads</text>
  <rect x="640" y="322" width="290" height="100" rx="8" class="box"/>
  <text x="656" y="352" class="t">Function tools</text>
  <text x="656" y="376" class="s">Agents look up exact facts by calling</text>
  <text x="656" y="396" class="s">tools — no vector search, no guessing.</text>
  <path d="M560 149 H616" class="a"/><text x="569" y="140" class="lbl">wake</text>
  <path d="M620 269 H304" class="a"/><text x="420" y="261" class="lbl">tools read stats</text>
  <path d="M620 389 H304" class="a"/><text x="400" y="381" class="lbl">tools read season data</text>

  <!-- ===== Right: board + decision chain ===== -->
  <rect x="1010" y="94" width="350" height="96" rx="10" class="board"/>
  <text x="1030" y="128" class="t">Booth Board</text>
  <text x="1030" y="152" class="s">shared blackboard of insight cards</text>
  <text x="1030" y="174" class="s">Proposed → Producer queue → Aired</text>
  <path d="M950 142 H1006" class="a"/><text x="958" y="133" class="lbl">cards</text>

  <rect x="1010" y="222" width="350" height="72" rx="8" class="check"/>
  <text x="1030" y="252" class="t">Verifier</text>
  <text x="1030" y="276" class="s">recomputes every number · gpt-5-nano</text>
  <rect x="1010" y="326" width="350" height="72" rx="8" class="check"/>
  <text x="1030" y="356" class="t">Producer</text>
  <text x="1030" y="380" class="s">audience fit, ranking, timing · gpt-5-nano</text>
  <rect x="1010" y="430" width="350" height="72" rx="8" class="agent"/>
  <text x="1030" y="460" class="t">Narrator</text>
  <text x="1030" y="484" class="s">one spoken line per language · gpt-5-mini</text>
  <rect x="1010" y="560" width="350" height="72" rx="8" class="voice"/>
  <text x="1030" y="590" class="t">Voice</text>
  <text x="1030" y="614" class="s">Azure AI Speech · EN ES FR DE</text>

  <path d="M1185 190 V218" class="a"/><text x="1197" y="208" class="lbl">new card</text>
  <path d="M1185 294 V322" class="a"/><text x="1197" y="312" class="lbl">verified</text>
  <path d="M1185 398 V426" class="a"/><text x="1197" y="416" class="lbl">fits the audience</text>
  <path d="M1185 502 V556" class="a"/>
  <path d="M1010 258 H954" class="ar"/>
  <text x="936" y="314" text-anchor="end" class="lbl" style="fill:#d23b3b">rejected → the agent fixes it (one retry)</text>
  <text x="1197" y="533" class="lbl">spoken line</text>

  <!-- ===== Bottom: play-by-play + showrunner ===== -->
  <rect x="360" y="560" width="300" height="72" rx="8" class="check"/>
  <text x="378" y="590" class="t">Caller</text>
  <text x="378" y="614" class="s">live play-by-play · gpt-5-nano</text>
  <path d="M40 160 H22 V596 H356" class="a"/><text x="40" y="586" class="lbl">events, 2 s ahead of the screen</text>
  <path d="M660 596 H1006" class="a"/><text x="760" y="587" class="lbl">play-by-play lines</text>

  <rect x="1010" y="680" width="350" height="72" rx="8" class="box"/>
  <text x="1030" y="710" class="t">Showrunner screen</text>
  <text x="1030" y="734" class="s">pitch, board, subtitles, audio</text>
  <path d="M1185 632 V676" class="a"/><text x="1197" y="658" class="lbl">audio + subtitles</text>

  <rect x="620" y="680" width="330" height="72" rx="8" class="box"/>
  <text x="638" y="710" class="t">Human showrunner</text>
  <text x="638" y="734" class="s">settings, “focus on Novak”, remove / say now</text>
  <path d="M950 716 H980 V362 H1006" class="a"/><text x="988" y="660" class="lbl">directives</text>

  <text x="40" y="784" class="s">Built with Microsoft Foundry (gpt-5-mini, gpt-5-nano) · Microsoft Agent Framework · Azure AI Speech · Azure Container Apps</text>
</svg>
</div></div>
